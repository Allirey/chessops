name: Check
on:
  push:
    branches:
      - main
    tags:
      - v*.*.*
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          cache: npm
      - run: npm ci
      - run: npm test
      - run: cd examples && npm ci
      - run: cd fuzz && npm ci && npm run compile
      - run: npm run lint
      - run: npm run check-format
  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write # npm trusted publishing
      contents: write # github release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          cache: npm
      - name: Check tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm publish
      - name: Extract release notes from changelog
        run: |
          awk -v ver="$GITHUB_REF_NAME" '$0 == "## " ver { flag = 1; next } /^## / { flag = 0 } flag' CHANGELOG.md > release-notes.md
          grep -q . release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
